[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-harness"
version = "1.0.0"
description = "Multi-turn agent evaluation & testing harness: scripted conversations graded for tool selection, structured output, context retention, hallucination, safety and task completion."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Faraz Ahmed Qureshi" }]
keywords = ["llm", "agents", "evaluation", "testing", "tool-calling", "fastapi"]
dependencies = []  # the core harness is standard-library only

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
agent-harness = "agent_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_harness = ["data/*.json", "data/scenarios/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
